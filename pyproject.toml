# Packaging for segment_kmeans. Install with:  pip install .
# Then run from anywhere with the `segment-kmeans` command, e.g.:
#   segment-kmeans my_survey.csv
#   segment-kmeans --serve
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "segment-kmeans"
version = "1.13.0"                 # keep in sync with __version__ in segment_kmeans.py
description = "Market-segmentation-grade clustering (k-means, Gaussian mixture, latent class) with stability-first validation, a typing tool, automatic survey-file handling, and a no-expertise web UI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    # Core, not optional: every result draws six charts, and "see the data yourself" is the
    # feature that lets a reader disagree with the write-up rather than take it on trust.
    "matplotlib>=3.6",
    # Hartigan's dip test, used as the second cluster-tendency check. A dependency rather than a
    # local implementation on purpose: the algorithm is subtle enough that a re-derivation is a
    # liability, and the first attempt at one scored a plain normal sample at the maximum possible
    # dip. The tool still runs without it — the check reports itself as not run — but a build that
    # ships without it is quietly weaker, so it belongs here rather than under an extra.
    "diptest>=0.9",
    # Every table in the report is rendered through DataFrame.to_markdown, which requires this.
    # It was an optional extra called "prettier Markdown tables", and that description was wrong:
    # without it the report contains no tables AT ALL. Measured with it blocked — eight markdown
    # tables become zero, and eight <table> elements in the HTML report become zero, so segment
    # sizes, the stability checks, the centroids and the whole k-selection panel arrive as
    # run-together text. Neither CI nor build_app.py installed the extra, so it was present only
    # on the machine that happened to have it, which is the third time a capability has been
    # declared optional and then quietly missing everywhere else.
    "tabulate>=0.9",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]         # read .xlsx survey exports
ai = ["anthropic>=0.40"]          # "ask Claude about your segments" chat (optional; bring your own key)
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/tomtomhz/survey-segmenter"
Repository = "https://github.com/tomtomhz/survey-segmenter"
Changelog = "https://github.com/tomtomhz/survey-segmenter/blob/main/CHANGELOG.md"

[project.scripts]
segment-kmeans = "segment_kmeans:_cli"

[tool.setuptools]
py-modules = ["segment_kmeans", "webapp", "charts", "kprototypes", "clusterability",
              "ai_interpret", "maxdiff", "planner", "turf", "design"]
