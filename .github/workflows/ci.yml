name: CI

# The two tests that matter most are test_recovers_planted_structure (finds real segments) and
# test_rejects_structureless_noise (does NOT invent segments in random data) — a green tick here
# means both still hold.
#
# **Why this does not run everything on every push.** This is a PRIVATE repo, so Actions minutes
# are metered against a monthly allowance. Running the full matrix on every push consumed the whole
# August allowance in SEVEN DAYS, and GitHub then stops running jobs rather than billing — which is
# worse than a slow CI, because the failure looks like a broken build. Every run after that point
# failed before executing a step, and it took two hours and a released version to notice.
#
# So the cost is spent where it buys something:
#
#   ordinary push to main   3.12 only, plus the frontend    the fast answer, most of the value
#   pull request            full matrix                     before anything merges
#   tag (v*)                full matrix + packaging         a release is tested on every version
#   weekly schedule         full matrix + packaging         catches dependency drift unprompted
#   manual dispatch         full matrix + packaging         when you want certainty
#
# 3.9 is the floor declared in pyproject.toml and 3.12 the newest supported, so the two ends of the
# supported range are what the full matrix must cover; 3.11 is the interpolation.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # Mondays, early — a failure is waiting when the week starts
  workflow_dispatch:

# A second push while the first is still running makes the first one pointless. Cancelling it is
# free minutes back, and on a repo pushed to this often it is a large fraction of the bill.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu for the matrix, macOS as well wherever it is worth the minutes — see below.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # An ordinary push to main gets the newest supported Python only. Everything else — tags,
        # pull requests, the weekly run, manual dispatch — gets all three.
        python-version: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
                            && fromJSON('["3.12"]')
                            || fromJSON('["3.9","3.11","3.12"]') }}
        # **Why macOS is here at all, given the tests already run on Linux.**
        #
        # macOS is the platform this tool actually ships on — the desktop app is a signed .app and
        # its users are on Macs. Linux was never the target; it is where CI runs because on a
        # PRIVATE repo macOS runners bill at ten times the Linux rate, so the tests guarding a Mac
        # tool were running on the one platform nobody uses it on.
        #
        # That has caught real defects in BOTH directions. Linux found a locale bug that made the
        # tool unrunnable with no LANG set, which macOS can never reveal because it always reports
        # UTF-8. And the failures macOS alone can show — case-insensitive paths, the signing and
        # quarantine behaviour around the bundle — had no coverage at all.
        #
        # So: Linux on every run, macOS only where it earns the minutes. On a public repo minutes
        # are free and this costs nothing; the restriction is what keeps it affordable if the
        # repository is ever private again.
        os: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
                && fromJSON('["ubuntu-latest"]')
                || fromJSON('["ubuntu-latest","macos-latest"]') }}
        exclude:
          # macos-latest is arm64, and setup-python's coverage of 3.9 there has been patchy — a
          # missing interpreter fails the job for a reason that has nothing to do with this code.
          # 3.9 is the declared floor and is tested on Linux every time, which is what the floor
          # needs; macOS is here to exercise the platform the app SHIPS on, and the newest two
          # versions do that. Drop this exclude if the runner image gains 3.9.
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `ai` is required: the suite covers the Claude layer (request shape against a mock
          # server, truncated-answer handling), and without anthropic installed those tests fail
          # on an import rather than testing anything. No API key is used or needed.
          pip install ".[ai,excel,dev]"

      # Every .py in the repo, found rather than listed. The named list had already gone stale --
      # clusterability.py was never in it and so was never linted -- which is the same defect that
      # kept a module out of the wheel twice and diptest out of every CI-built app.
      - name: Lint
        run: pyflakes $(git ls-files '*.py')

      - name: Test
        run: pytest -q

  frontend:
    # The interface is a React + TypeScript app in frontend/, compiled to webui/. Its own tests
    # cover what the Python suite no longer can: that a failed request never wedges the page,
    # that unreadable files are refused before upload, and that the result blocks behave.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      - name: The committed build must match the source
        # webui/ is committed so the app runs without Node and PyInstaller can bundle it. That
        # only works if it is current: rebuild here and fail if the result differs, rather than
        # shipping an interface one commit behind its own source.
        run: |
          npm run build
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code --stat webui \
            || { echo "::error::webui/ is stale — run 'npm run build' in frontend/ and commit."; exit 1; }

  package:
    # Proves the thing is installable from a clean checkout, which is the failure mode a test
    # suite never catches: the tests import the module from the working directory, so a broken
    # pyproject.toml passes every test and then nobody can install it.
    #
    # Skipped on ordinary pushes. What it guards — pyproject.toml, the dependency list, the entry
    # point — does not change on most commits, and it is the whole job's minutes every time. It
    # still runs before every release, which is the moment installability actually matters.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel, then run the CLI
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          segment-kmeans --help
