name: CI

# Every push and every pull request runs the full suite. The two tests that matter most are
# test_recovers_planted_structure (finds real segments) and test_rejects_structureless_noise
# (does NOT invent segments in random data) — a green tick here means both still hold.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml, so it is tested, not assumed.
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `ai` is required: the suite covers the Claude layer (request shape against a mock
          # server, truncated-answer handling), and without anthropic installed those tests fail
          # on an import rather than testing anything. No API key is used or needed.
          pip install ".[ai,excel,dev]"

      # Every .py in the repo, found rather than listed. The named list had already gone stale --
      # clusterability.py was never in it and so was never linted -- which is the same defect that
      # kept a module out of the wheel twice and diptest out of every CI-built app.
      - name: Lint
        run: pyflakes $(git ls-files '*.py')

      - name: Test
        run: pytest -q

  frontend:
    # The interface is a React + TypeScript app in frontend/, compiled to webui/. Its own tests
    # cover what the Python suite no longer can: that a failed request never wedges the page,
    # that unreadable files are refused before upload, and that the result blocks behave.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      - name: The committed build must match the source
        # webui/ is committed so the app runs without Node and PyInstaller can bundle it. That
        # only works if it is current: rebuild here and fail if the result differs, rather than
        # shipping an interface one commit behind its own source.
        run: |
          npm run build
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code --stat webui \
            || { echo "::error::webui/ is stale — run 'npm run build' in frontend/ and commit."; exit 1; }

  package:
    # Proves the thing is installable from a clean checkout, which is the failure mode a test
    # suite never catches: the tests import the module from the working directory, so a broken
    # pyproject.toml passes every test and then nobody can install it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel, then run the CLI
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          segment-kmeans --help
